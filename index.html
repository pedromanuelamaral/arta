<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>arta — Curated Poetry & Literary Archive</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #070709;
      --bg-surface: #0E0F13;
      --bg-elevated: #15171D;
      --bg-highlight: #1D1F27;
      
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-focus: rgba(255, 255, 255, 0.22);
      
      --text-primary: #F3F4F6;
      --text-secondary: #9CA3AF;
      --text-muted: #6B7280;
      
      --accent-warm: #E5E7EB;
      --accent-gold: #D4A373;
      
      --font-serif: "Cormorant Garamond", Georgia, serif;
      --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", monospace;
      
      --measure: 68ch;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top Navigation Bar */
    header.site-header {
      height: 56px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-primary);
      cursor: pointer;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .brand-version {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background-color 0.15s;
      text-decoration: none;
    }

    .nav-btn:hover {
      color: var(--text-primary);
    }

    .nav-btn.active {
      color: var(--text-primary);
      background: var(--bg-surface);
      border-color: var(--border-subtle);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      width: 220px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-input:focus {
      border-color: var(--border-focus);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    /* Main Workspace Layout */
    .workspace {
      display: flex;
      flex: 1;
      min-height: calc(100vh - 56px);
    }

    /* Left Sidebar: Works Catalog */
    aside.catalog-sidebar {
      width: 340px;
      min-width: 340px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      padding: 1rem 1.25rem 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .filter-pill {
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-pill:hover {
      color: var(--text-secondary);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .filter-pill.active {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border-color: var(--border-focus);
    }

    .works-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .work-item {
      padding: 0.75rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background-color 0.15s, border-color 0.15s;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .work-item:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .work-item.active {
      background: var(--bg-elevated);
      border-color: var(--border-subtle);
    }

    .work-item-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .work-item-title {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .work-item-poet {
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    /* Right Main Stage: Pure Reading */
    main.reading-stage {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: 3rem 4rem;
      background: var(--bg-base);
    }

    .reading-container {
      max-width: var(--measure);
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .poem-meta-header {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .poem-region-pill {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .poem-headline {
      font-family: var(--font-serif);
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      font-weight: 400;
      color: var(--text-primary);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .poet-byline {
      font-size: 1.1rem;
      color: var(--accent-gold);
      font-family: var(--font-serif);
      font-style: italic;
    }

    .publication-note {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Embedded Video / Media Player */
    .media-embed-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      background: #000000;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .media-embed-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .media-external-bar {
      margin-top: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .media-source-tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .media-direct-link {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    .media-direct-link:hover {
      color: var(--accent-gold);
      text-decoration: underline;
    }

    /* Full Poem Typography */
    .poem-text-sanctuary {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      line-height: 2.1;
      color: var(--text-primary);
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
      padding: 1.5rem 0;
    }

    .curatorial-reflection {
      padding-top: 2rem;
      border-top: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.92rem;
      line-height: 1.7;
    }

    /* Portuguese Literary Shows Section */
    .shows-view {
      display: none;
      flex-direction: column;
      gap: 2.5rem;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .shows-header {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .shows-headline {
      font-family: var(--font-serif);
      font-size: 2.4rem;
      font-weight: 400;
    }

    .shows-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .shows-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 1.5rem;
    }

    .show-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      transition: border-color 0.15s;
    }

    .show-card:hover {
      border-color: var(--border-focus);
    }

    .show-title {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      color: var(--text-primary);
    }

    .show-hosts {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--accent-gold);
    }

    .show-desc {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.6;
      flex: 1;
    }

    .show-link-btn {
      align-self: flex-start;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      padding: 0.45rem 0.9rem;
      border-radius: 5px;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .show-link-btn:hover {
      background: var(--bg-highlight);
      border-color: var(--border-focus);
    }

    /* Mobile Responsive Viewport Overrides */
    @media (max-width: 860px) {
      .workspace {
        flex-direction: column;
      }

      aside.catalog-sidebar {
        width: 100%;
        min-width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border-subtle);
        max-height: 260px;
      }

      main.reading-stage {
        padding: 2rem 1.25rem;
      }

      .search-input {
        width: 150px;
      }
    }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header class="site-header">
    <div class="brand" id="brandBtn">
      <span class="brand-title">arta</span>
      <span class="brand-version">v0.0.1</span>
    </div>

    <nav class="header-nav">
      <button class="nav-btn active" id="viewWorksBtn">Works</button>
      <button class="nav-btn" id="viewShowsBtn">Portuguese Literary Shows</button>
    </nav>

    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Search author, title...">
    </div>
  </header>

  <!-- Workspace Container -->
  <div class="workspace">

    <!-- Left Catalog Rail -->
    <aside class="catalog-sidebar" id="catalogSidebar">
      <div class="filter-pills" id="filterRow">
        <button class="filter-pill active" data-filter="all">All</button>
        <button class="filter-pill" data-filter="PT">Portugal</button>
        <button class="filter-pill" data-filter="UK">United Kingdom</button>
        <button class="filter-pill" data-filter="USA">United States</button>
        <button class="filter-pill" data-filter="COSMOPOLITAN">Cosmopolitan</button>
      </div>
      <div class="works-list" id="worksListContainer"></div>
    </aside>

    <!-- Reading & Shows Stage -->
    <main class="reading-stage" id="readingStage">
      
      <!-- Poem Reading Stage -->
      <article class="reading-container" id="readingView">
        <div class="poem-meta-header">
          <span class="poem-region-pill" id="poemRegionText">Portugal</span>
          <h1 class="poem-headline" id="poemTitleText"></h1>
          <div class="poet-byline" id="poetBylineText"></div>
          <div class="publication-note" id="publicationNoteText"></div>
        </div>

        <!-- Direct Media Embed Container -->
        <div class="media-embed-container" id="mediaContainer">
          <iframe id="videoIframe" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="media-external-bar" id="mediaExternalBar">
          <span class="media-source-tag" id="mediaSourceTag">Verified Spoken-Word Recording</span>
          <a class="media-direct-link" id="externalMediaLink" href="#" target="_blank" rel="noopener noreferrer">Watch / Listen on YouTube &rarr;</a>
        </div>

        <!-- Full Poem Text -->
        <div class="poem-text-sanctuary" id="poemBodyText"></div>

        <!-- Quiet Curatorial Note -->
        <div class="curatorial-reflection" id="curatorialNoteText"></div>
      </article>

      <!-- Portuguese Literary Shows Stage -->
      <section class="shows-view" id="showsView">
        <div class="shows-header">
          <h2 class="shows-headline">Portuguese Literary Shows</h2>
          <p class="shows-subtitle">Free, unauthenticated public broadcasts preserved in the RTP Play television archive.</p>
        </div>
        <div class="shows-grid" id="showsGrid"></div>
      </section>

    </main>
  </div>

  <script>
    // --- PORTUGUESE LITERARY SHOWS ---
    const RTP_SHOWS = [
      {
        title: "Literatura Agora",
        hosts: "Pedro Lamares, Filipa Leal",
        desc: "Weekly literary magazine dedicated to poetry, translation, independent bookshops, and the living reality of written words.",
        url: "https://www.rtp.pt/play/p1747/literatura-agora"
      },
      {
        title: "Literatura Aqui",
        hosts: "Pedro Lamares",
        desc: "Anthology bringing literature directly into streets, public squares, commuter trains, and community spaces throughout Portugal.",
        url: "https://www.rtp.pt/play/p3081/literatura-aqui"
      },
      {
        title: "A Pequena Biblioteca",
        hosts: "Filipa Leal",
        desc: "Concise, visually arresting video reflections exploring essential masterworks of Portuguese and international literature.",
        url: "https://www.rtp.pt/play/p13146/a-pequena-biblioteca"
      },
      {
        title: "Nada Será Como Dante",
        hosts: "Filipa Leal, Pedro Lamares",
        desc: "Flagship literary debate and recitation broadcast engaging books with contemporary society, philosophy, and performance.",
        url: "https://www.rtp.pt/play/p8322/nada-sera-como-dante"
      }
    ];

    // --- CURATED MASTERWORKS (FRESH DISCOVERIES) ---
    const FRESH_POEMS = [
      // PORTUGAL
      {
        id: "pt-1",
        title: "Para atravessar contigo o deserto do mundo",
        poet: "Sophia de Mello Breyner Andresen",
        region: "PT",
        regionLabel: "Portugal",
        book: "Livro Sexto (1962, Portugália Editora)",
        videoId: "Q2psF5REBs0",
        source: "Assírio & Alvim / RTP Ensina",
        note: "One of the towering ethical lyrics of Portuguese literature. The speaker leaves behind aesthetic comfort and solitude to step nakedly into the hard light of shared human ordeal.",
        verse: `Para atravessar contigo o deserto do mundo
Para enfrentarmos juntos o terror da morte
Para ver a verdade para perder o medo
Ao lado dos teus passos caminhei

Por ti deixei meu reino meu segredo
Minha rápida noite meu silêncio
Minha pérola redonda e seu oriente
Meu espelho minha vida minha imagem
E abandonei os jardins do paraíso

Cá fora à luz sem véu do dia duro
Sem os espelhos vi que estava nua
E ao deserto chamavam terra pura.`
      },
      {
        id: "pt-2",
        title: "Há-de flutuar uma cidade no crepúsculo da vida",
        poet: "Al Berto",
        region: "PT",
        regionLabel: "Portugal",
        book: "O Medo (1987, Assírio & Alvim)",
        videoId: "PhwBFj0l7LI",
        source: "Casa Fernando Pessoa / Al Berto Archive",
        note: "Spoken by Al Berto himself over a solemn acoustic texture. Memory operates as a physical, late-afternoon coastal solitude that leaves a pearl inside the chest with nobody left to receive it.",
        verse: `há-de flutuar uma cidade no crepúsculo da vida
pensava eu... como seriam felizes as mulheres à beira mar
debruçadas para a luz caiada
remendando o pano das velas
espiando o mar e a longitude do amor embarcado

por vezes uma gaivota pousava nas águas
outras era o sol que cegava
e um dardo de sangue alastrava pelo linho da noite
os dias lentíssimos... sem ninguém

e nunca me disseram o nome daquele oceano
esperei sentada à porta... dantes escrevia cartas
punha-me a olhar a risca de mar ao fundo da rua
assim envelheci... acreditando que algum homem
ao passar se espantasse com a minha solidão

(anos mais tarde, recordo agora, cresceu-me uma pérola no coração.
mas estou só, muito só, não tenho a quem a deixar.)

um dia houve que nunca mais avistei cidades crepusculares
e os barcos deixaram de fazer escala à minha porta
inclino-me de novo para o pano deste século
recomeço a bordar ou a dormir tanto faz
sempre tive dúvidas que alguma vez me visite a felicidade.`
      },
      {
        id: "pt-3",
        title: "Homens que são como lugares mal situados",
        poet: "Daniel Faria",
        region: "PT",
        regionLabel: "Portugal",
        book: "Homens que São como Lugares Mal Situados (1998, Fundação Manuel Leão)",
        videoId: "5DZz-lfEd5g",
        source: "Assírio & Alvim / RTP Ensina",
        note: "One of the most austere and devastating poems of late 20th-century Portugal. Daniel Faria observes existence as ransacked rooms and abandoned doors where no wheat is harvested.",
        verse: `Homens que são como lugares mal situados
Homens que são como casas saqueadas
Onde o vento bate e entra
E revolve as cinzas do lar.

Homens com uma gaveta aberta
Onde alguém procurou e não encontrou.
Homens que têm na boca uma palavra
Que já ninguém compreende nem quer escutar.

Homens que guardam um cão à porta
E não têm porta nem chão.
Homens que levam nos olhos
A terra onde foram lavrados
E não deram fruto nem trigo nem pão.`
      },
      {
        id: "pt-4",
        title: "Descrição da Guerra em Guernica",
        poet: "Carlos de Oliveira",
        region: "PT",
        regionLabel: "Portugal",
        book: "Entre Duas Memórias (1971, Dom Quixote)",
        videoId: "7INiEvXUERE",
        source: "RTP Voz / Jorge Silva Melo",
        note: "Written on Picasso's canvas. The peasant angel enters through the window holding a simple kerosene lamp, uncomprehending before modern industrial bombardment.",
        verse: `Entra pela janela
o anjo camponês;
com a terceira luz na mão;
minucioso, habituado
aos interiores de cereal,
aos utensílios que dormem na fuligem;
os seus olhos rurais
não compreendem bem os símbolos
desta colheita: hélices,
motores furiosos;
e estende mais o braço; planta
no ar, como uma árvore
a chama do candeeiro.`
      },
      {
        id: "pt-5",
        title: "O Funcionário Cansado",
        poet: "António Ramos Rosa",
        region: "PT",
        regionLabel: "Portugal",
        book: "O Grito Claro (1958, Colecção Círculo de Poesia)",
        videoId: "54SNlyG0UWI",
        source: "RTP Ensina (Adriano Luz)",
        note: "A seminal audit of bureaucratic alienation. Returning from an exemplary day with keys in the pockets, sitting at the cold dinner table, stamping life with the purple ink of patience.",
        verse: `A noite trocou-me os sonhos e as mãos
dispersou-me os amigos
pôs espelhos no lugar dos olhos
e gavetas nos passos.

O funcionário cansado dum dia exemplar
regressa a casa com as chaves nos bolsos
e a solidão na garganta.
Sentado à mesa onde a sopa arrefece
olha a família como quem olha
uma repartição estrangeira.

Não tem pressa nem medo.
Amanhã voltará a carimbar a vida
com a tinta roxa da paciência.`
      },
      {
        id: "pt-6",
        title: "E Tudo Era Possível",
        poet: "Ruy Belo",
        region: "PT",
        regionLabel: "Portugal",
        book: "Aquele Grande Rio Eufrates (1961, Portugália Editora)",
        videoId: "IHtg1DKcX18",
        source: "Presença / Antologia Ruy Belo",
        note: "The irreversible transition from childhood's unmapped openness to the geometry of walls, clocks, and mortal boundaries where distance is only the gap from oneself to oneself.",
        verse: `E tudo era possível quando eu era pequeno.
O mundo era uma casa sem portas nem janelas,
onde qualquer caminho dava para o mar.
Podia-se tocar as estrelas com a mão
e os dias não tinham pressa de acabar.

Depois vieram as medidas e os relógios,
a lenta geometria dos muros e dos nomes,
e a certeza de que a terra é redonda e tem fim.
Hoje sei que a distância entre as coisas
é apenas a distância que vai de mim a mim.`
      },
      {
        id: "pt-7",
        title: "Dispersão",
        poet: "Mário de Sá-Carneiro",
        region: "PT",
        regionLabel: "Portugal",
        book: "Dispersão (1913, Edição de Autor)",
        videoId: "INluTzdBVMA",
        source: "Orpheu Archive / Mário Viegas",
        note: "The central modernist lyric of psychic disintegration and estrangement from one's own identity.",
        verse: `Perdi-me dentro de mim
Porque eu era labirinto,
E hoje, quando me sinto,

    const showsView = document.getElementById("showsView");

    const viewShowsBtn = document.getElementById("viewShowsBtn");
    const brandBtn = document.getElementById("brandBtn");

    // Render RTP Shows
    function renderShows() {
      showsGrid.innerHTML = RTP_SHOWS.map(show => `
        <div class="show-card">
          <div class="show-title">${show.title}</div>
          <div class="show-hosts">${show.hosts}</div>
          <div class="show-desc">${show.desc}</div>
          <a class="show-link-btn" href="${show.url}" target="_blank" rel="noopener noreferrer">
            Watch on RTP Play &rarr;
          </a>
        </div>
      `).join("");
    }

    // Filter Logic
    function getFilteredPoems() {
      return FRESH_POEMS.filter(p => {
        const matchesFilter = (currentFilter === "all") || (p.region === currentFilter);
        const matchesSearch = !searchQuery || 
          p.title.toLowerCase().includes(searchQuery) ||
          p.poet.toLowerCase().includes(searchQuery) ||
          p.verse.toLowerCase().includes(searchQuery);
        return matchesFilter && matchesSearch;
      });
    }

    // Render Works List
    function renderList() {
      const list = getFilteredPoems();
      worksListContainer.innerHTML = "";

      if (list.length === 0) {
        worksListContainer.innerHTML = `
          <div style="padding: 2rem 1rem; color: var(--text-muted); font-size: 0.8rem; font-family: var(--font-mono); text-align: center;">
            No works match criteria.
          </div>
        `;
        return;
      }

      if (!list.some(p => p.id === activePoemId)) {
        activePoemId = list[0].id;
      }

      list.forEach(poem => {
        const item = document.createElement("div");
        item.className = `work-item ${poem.id === activePoemId ? "active" : ""}`;
        item.innerHTML = `
          <div class="work-item-meta">
            <span>${poem.regionLabel}</span>
          </div>
          <div class="work-item-title">${poem.title}</div>
          <div class="work-item-poet">${poem.poet}</div>
        `;
        item.addEventListener("click", () => {
          activePoemId = poem.id;
          if (currentTab !== "works") switchTab("works");
          renderList();
          renderStage();
        });
        worksListContainer.appendChild(item);
      });
    }

              <div style="position:absolute;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(2px);"></div>
              <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:0.75rem;">
                <div style="width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,0.92);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(0,0,0,0.6);">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="#070709" style="margin-left:3px;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </div>
                <span style="font-family:var(--font-mono);font-size:0.76rem;color:#FFF;letter-spacing:0.04em;">Listen to Spoken Performance &rarr;</span>
              </div>
            </div>
          `;
        } else {
          // HTTP/HTTPS/Docker: Native embed runs directly without any API key or config error
          mediaContainer.innerHTML = `
            <iframe id="videoIframe" src="https://www.youtube.com/embed/${poem.videoId}?rel=0&modestbranding=1" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;"></iframe>
          `;
        }
      } else {
        mediaContainer.style.display = "none";
        externalBar.style.display = "none";
      }
    }

    // View Switching
    function switchTab(tab) {
      currentTab = tab;
      if (tab === "works") {
        viewWorksBtn.classList.add("active");
        viewShowsBtn.classList.remove("active");
        readingView.style.display = "flex";
        showsView.style.display = "none";
        renderStage();
      } else {
        viewShowsBtn.classList.add("active");
        viewWorksBtn.classList.remove("active");
        readingView.style.display = "none";
        showsView.style.display = "flex";
      }
    }

    // Events
    viewWorksBtn.addEventListener("click", () => switchTab("works"));
    viewShowsBtn.addEventListener("click", () => switchTab("shows"));
    brandBtn.addEventListener("click", () => switchTab("works"));

    filterPills.forEach(pill => {
      pill.addEventListener("click", () => {
        filterPills.forEach(p => p.classList.remove("active"));
        pill.classList.add("active");
        currentFilter = pill.dataset.filter;
        renderList();
        renderStage();
      });
    });

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderList();
    });

    // Keyboard navigation (CMD+K to search)
    window.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "k") {
        e.preventDefault();
        searchInput.focus();
      }
    });

    // Init
    renderShows();
    renderList();
    renderStage();
  </script>
</body>
</html>
